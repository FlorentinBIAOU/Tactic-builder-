name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Supabase stub
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/stub.sql
      - name: Apply migrations twice (must be idempotent)
        run: |
          for run in 1 2; do
            for f in supabase/migrations/*.sql; do
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done
      - name: Smoke tests
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/smoke.sql
